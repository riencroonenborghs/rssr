AllCops:
  NewCops:
    enable
  Exclude:
    - 'db/*schema.rb'
    - 'db/migrate/*.rb'
    - 'node_modules/**/*'
    - 'bin/**/*'
    - 'config/**/*'
    - 'vendor/bundle/**/*'

Style/StringLiterals:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
Style/BlockComments:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Layout/LineLength:
  Enabled: false
Style/Documentation:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Style/ArgumentsForwarding:
  Enabled: false
Layout/MultilineMethodCallIndentation:
  Enabled: false
Layout/EndAlignment:
  Enabled: false
Layout/ElseAlignment:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Layout/FirstArgumentIndentation:
  Enabled: false
Layout/HashAlignment:
  Enabled: false
Layout/ArrayAlignment:
  Enabled: false
# Capistrano's file name.
Naming/FileName:
  Exclude:
    - 'Capfile.rb'

# Service objects are called through ApplicationService.call and have no state to initialize there.
Lint/MissingSuper:
  AllowedParentClasses:
    - ApplicationService

# System specs save screenshots on purpose.
Lint/Debugger:
  DebuggerMethods:
    Capybara: ~

# Normalizers read better as ->(value) { value.strip } than lambda(&:strip).
Style/SymbolProc:
  AllowedMethods:
    - lambda

# Match the Rails style the code is written in: spaces inside array brackets, and private methods
# indented under `private` without a blank line after it.
Layout/SpaceInsideArrayLiteralBrackets:
  EnforcedStyle: space
Layout/IndentationConsistency:
  EnforcedStyle: indented_internal_methods
Layout/EmptyLinesAroundAccessModifier:
  EnforcedStyle: only_before
